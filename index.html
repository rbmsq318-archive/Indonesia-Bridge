function lineChart(rows,ys){if(!ys.length||!rows.length)return '<div class="empty">표시할 데이터가 없습니다.</div>';let series=ys.map(y=>({y,a:sum(rows.filter(r=>r.year===y),'market_usd'),b:sum(rows.filter(r=>r.year===y),'bilateral_usd')}));let max=Math.max(1,...series.map(s=>s.a)),x=i=>60+i*475/Math.max(1,series.length-1),y=v=>190-v/max*155;let p=key=>series.map((s,i)=>`${x(i)},${y(s[key])}`).join(' ');return `<svg viewBox="0 0 570 225" role="img" aria-label="연도별 수입시장 규모와 양국 무역액">${[0,.25,.5,.75,1].map(v=>`<line x1="60" y1="${y(max*v)}" x2="535" y2="${y(max*v)}" stroke="#e2e8ec" stroke-dasharray="3 3"/><text x="52" y="${y(max*v)+4}" text-anchor="end" font-size="10" fill="#627586">${usd(max*v)}</text>`).join('')}<polyline points="${p('a')}" fill="none" stroke="#9db1bd" stroke-width="3"/><polyline points="${p('b')}" fill="none" stroke="#087e80" stroke-width="3"/>${series.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.a)}" r="4" fill="#9db1bd"><title>${s.y}: ${usd(s.a)}</title></circle><circle cx="${x(i)}" cy="${y(s.b)}" r="4" fill="#087e80"><title>${s.y}: ${usd(s.b)}</title></circle><text x="${x(i)}" y="213" text-anchor="middle" font-size="11" fill="#627586">${s.y}</text>`).join('')}</svg><div class="legend"><span><i class="dot gray"></i>수입국의 전체 수입액</span><span><i class="dot"></i>상대국으로부터의 수입액</span></div>`}

function opportunity(){return header('03 / OPPORTUNITY SCANNER','유망 품목 분석','성장성·시장 규모·점유율 여력을 기준으로 조사 후보를 선별합니다.')+notice()+filterbar()+`<div class="grid2 equal"><section class="panel"><h2>평가 방식</h2><p class="footnote">성장률 45점: 전년비 0~25%를 선형 환산<br>시장 규모 35점: 선택 집합 내 최대 규모 대비 log(1+USD)<br>점유율 여력 20점: 1 − 상대국 점유율<br>전년 자료나 시장액이 없으면 점수 미산정.</p></section><section class="panel"><h2>활용 및 제한</h2><p class="footnote">점수는 필터 집합에 따라 바뀝니다. 관세, 인증, 수요, 경쟁력, 물류비는 반영하지 않았습니다. 고득점은 심층 조사 우선순위일 뿐 투자·수출 권고가 아닙니다.</p></section></div><section class="panel"><div class="panel-head"><h2>탐색 순위</h2><span class="muted">점수 내림차순</span></div>${table(selected())}</section>`}
function monitor(){let a=feed.filter(f=>feedFilter==='all'||f.type===feedFilter);return header('04 / MARKET WATCH','규제·사업 모니터','정책 변경 및 사업 기회 수집 화면을 시뮬레이션합니다.')+`<div class="notice">실제 규제 변경 또는 입찰 공고가 아닙니다. 아래 카드는 수집할 주제의 예시이며 공식 페이지에서 사실을 확인해야 합니다.</div><div class="filters"><div class="field"><label>정보 유형</label><select onchange="feedFilter=this.value;render()"><option value="all">전체</option><option value="reg" ${feedFilter==='reg'?'selected':''}>규제·인증</option><option value="biz" ${feedFilter==='biz'?'selected':''}>사업 기회</option></select></div></div><section class="panel"><div class="stack">${a.map(f=>`<article class="item"><div class="meta"><span class="pill gray">시연용</span><span>${f.type==='reg'?'규제·인증':'사업 기회'}</span><span>${f.sector}</span></div><h3>${f.title}</h3><p>${f.desc}</p>${f.src>=0?`<a href="${sources[f.src][2]}" target="_blank" rel="noopener noreferrer">${sources[f.src][0]} 공식 페이지 ↗</a>`:'<span class="muted">공식 출처 추가 확인 필요</span>'}</article>`).join('')}</div></section>`}
function toggleWatch(hs){let i=watch.findIndex(w=>w.direction===filters.direction&&w.hs===hs);if(i>=0){watch.splice(i,1);notify('관심 목록에서 제거했습니다.')}else{let r=data.rows.find(r=>r.direction===filters.direction&&r.hs===hs);if(!r)return;watch.push({direction:r.direction,hs:r.hs,name:r.name,sector:r.sector});notify('관심 품목에 저장했습니다.')}save('watch',watch);render()}
function removeWatch(i){watch.splice(i,1);save('watch',watch);render()}
function buildAlerts(){let now=new Date().toISOString();queue=watch.map(w=>{let r=data.rows.filter(r=>r.direction===w.direction&&r.hs===w.hs).sort((a,b)=>b.year-a.year);let g=r.length>1&&r[0].year-r[1].year===1?rate(r[0].market_usd,r[1].market_usd):null;return {name:w.name,hs:w.hs,direction:w.direction,text:`${r[0]?.year??'—'}년 수입시장 ${usd(r[0]?.market_usd)} / 전년비 ${pct(g)}`,time:now,mode:data.mode}});save('queue',queue);addLog('관심 품목 알림 미리보기 '+queue.length+'건 생성');render();notify('알림 초안을 생성했습니다. 실제 발송은 하지 않았습니다.')}
function watchPage(){return header('05 / MY WATCHLIST','관심 목록·알림','관심 품목을 저장하고 최신 데이터에 대한 알림 초안을 생성합니다.',`<button class="btn primary" onclick="buildAlerts()">알림 생성</button>`)+notice()+`<div class="grid2 equal"><section class="panel"><div class="panel-head"><h2>저장 품목 (${watch.length})</h2><button class="btn" onclick="go('trade')">품목 추가</button></div><div class="stack">${watch.map((w,i)=>`<div class="item split"><div><b>${esc(w.name)}</b><p class="muted">HS ${esc(w.hs)} · ${w.direction==='KR_ID'?'한국 → 인니':'인니 → 한국'}</p></div><button class="btn small danger" onclick="removeWatch(${i})">삭제</button></div>`).join('')||'<div class="empty">무역 데이터 화면에서 관심 품목을 저장하세요.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>알림 초안 (${queue.length})</h2><button class="btn" onclick="downloadAlerts()">TXT 저장</button></div><div class="stack">${queue.map(q=>`<div class="item"><span class="pill gray">${q.mode==='demo'?'DEMO':'사용자 데이터'}</span><h3>${esc(q.name)}</h3><p>${esc(q.text)}</p><p class="muted">${esc(q.time)}</p></div>`).join('')||'<div class="empty">알림 생성 버튼을 실행하세요.</div>'}</div><p class="footnote">이메일 발송 서버 및 자동 예약은 연결되지 않았습니다.</p></section></div>`}
function reportText(){let a=selected(),m=sum(a,'market_usd'),b=sum(a,'bilateral_usd');return `INDONEISA BRIDGE | 무역시장 분석\n${data.mode==='demo'?'[가상 데이터 / 판매·시장판단 불가]':'[사용자 제공 데이터 / 출처 미검증]'}\n생성일: ${new Date().toLocaleDateString('ko-KR')}\n방향: ${dirLabel()} | 산업: ${filters.sector==='all'?'전체':filters.sector} | 연도: ${last()??'없음'}\n검색: ${filters.query||'전체'}\n\n1. 시장 요약\n선택 품목: ${a.length}개\n수입시장 규모: ${usd(m)}\n양국 무역액: ${usd(b)}\n점유율: ${share(m?b/m*100:null)}\n\n2. 탐색 후보 (최대 10개)\n${a.slice(0,10).map((r,i)=>`${i+1}. ${r.name} (HS ${r.hs}) | 시장 ${usd(r.market_usd)} | 성장 ${pct(r.growth)} | 점유율 ${share(r.share)} | 점수 ${r.score??'—'}`).join('\n')}\n\n3. 후속 조사\n공식 규제, 관세, 유통구조, 가격경쟁력 확인 필요.\n점수는 조사 우선순위이며 사업 성공 확률이 아닙니다.\n\n데이터: ${data.dataset_name}\n출처: ${data.source_url||'가상 또는 미지정'}\n상업적 활용 전 재이용 권한 확인 필수.`}
function reports(){return header('06 / REPORT STUDIO','리포트 센터','현재 필터를 바탕으로 분석 요약을 자동 생성합니다.')+notice()+filterbar()+`<section class="panel"><div class="panel-head"><div><h2>시장분석 보고서</h2><p class="muted">현재 조건에 따라 자동 재계산 · 브라우저 인쇄로 PDF 저장 가능</p></div><div class="actions"><button class="btn" onclick="download('IB_report.txt',reportText(),'text/plain')">TXT 저장</button><button class="btn" onclick="exportCSV()">CSV</button><button class="btn primary" onclick="window.print()">인쇄 / PDF</button></div></div><div class="report">${esc(reportText())}</div></section>`}
function revenue(){return header('07 / REVENUE LAB','수익화 실험실','구독료 자급자족 목표의 단위경제성과 잠재 고객 전환을 실험합니다.')+`<div class="notice">가상의 가격 및 판매량으로 계산합니다. 실제 결제·구독·매출이 발생하지 않습니다.</div><div class="plans">${[['Free',0,'기초 시장 탐색 · 무료 리포트'],['Individual',9900,'관심 품목 알림 · 상세 통계'],['Business',29900,'보고서 · CSV · 상세 비교']].map(([n,p,d],i)=>`<div class="plan ${i===1?'feature':''}"><h3>${n}</h3><div class="price">${won(p)} <span class="muted">/월</span></div><p>${d}</p><button class="btn ${i===1?'primary':''}" onclick="leadModal('${n}')">관심 등록 (시연)</button></div>`).join('')}</div><div class="grid2 equal"><section class="panel"><div class="panel-head"><h2>월간 수익 가정</h2></div><div class="formgrid">${[['individual','Individual 회원 (명)'],['business','Business 회원 (명)'],['reports','단건 리포트 판매 (19,900원)'],['cost','월 운영비 (원)'],['fee','판매 수수료 (%)'],['target','목표 세전 이익 (원)'],['visitors','월간 방문자 (명)'],['conversion','유료 전환율 (%)']].map(([k,l])=>`<div class="field"><label for="rev_${k}">${l}</label><input id="rev_${k}" type="number" min="0" ${['fee','conversion'].includes(k)?'max="100" step="0.1"':'step="1"'} value="${plan[k]}" oninput="updatePlan('${k}',this.value)"></div>`).join('')}</div></section><section class="panel"><h2>월 예상 수익</h2><div id="revenueResult" style="margin-top:15px"></div></section></div><section class="panel"><div class="panel-head"><div><h2>잠재 고객 관심 등록 (${leads.length})</h2><p class="muted">로컬 시연 데이터만 저장 · 이메일 등 개인정보 입력 금지</p></div><button class="btn" onclick="exportLeads()">CSV 저장</button></div><div class="tablewrap"><table><thead><tr><th>고객 유형</th><th>관심 분야</th><th>요금제</th><th>등록일</th><th></th></tr></thead><tbody>${leads.map((l,i)=>`<tr><td>${esc(l.type)}</td><td>${esc(l.sector)}</td><td>${esc(l.plan)}</td><td>${esc(l.date)}</td><td><button class="btn small danger" onclick="leads.splice(${i},1);save('leads',leads);render()">삭제</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">등록된 시연 고객이 없습니다.</td></tr>'}</tbody></table></div></section>`}
function updatePlan(k,v){let n=Math.max(0,Number(v)||0);if(['fee','conversion'].includes(k))n=Math.min(100,n);else n=Math.floor(n);plan[k]=n;save('plan',plan);revenueResult()}
function revenueResult(){let el=$('#revenueResult');if(!el)return;let rev=plan.individual*9900+plan.business*29900+plan.reports*19900,net=rev*(1-plan.fee/100)-plan.cost,unit=9900*(1-plan.fee/100),need=unit>0?Math.max(0,Math.ceil((plan.target+plan.cost)/unit)):null,conv=Math.floor(plan.visitors*plan.conversion/100);el.innerHTML=`<div class="result"><div class="muted">월 예상 세전 이익</div><div class="value ${net>=0?'positive':'negative'}">${won(net)}</div><p class="muted">${net>=plan.target?'목표 달성 가정':'목표 미달 가정'} · 실제 매출 아님</p></div><div class="stack" style="margin-top:16px"><div class="split"><span>월 매출</span><b>${won(rev)}</b></div><div class="split"><span>수수료</span><b>${won(rev*plan.fee/100)}</b></div><div class="split"><span>운영비</span><b>${won(plan.cost)}</b></div><div class="split"><span>Individual만 판매 시 필요 회원</span><b>${need==null?'산정 불가':need+'명'}</b></div><div class="split"><span>방문자 × 전환율 가정</span><b>${conv}명</b></div></div><p class="footnote">세금, 환불, 노동비용 제외. 전환 추정치는 입력한 회원수와 별도로 계산됩니다.</p>`}
function leadModal(p){openModal(`<div class="panel-head"><h2>잠재 고객 등록 · ${p}</h2><button class="btn" onclick="closeModal()">닫기</button></div><p class="notice">실제 결제 신청이 아닙니다. 고객 유형과 관심 산업만 저장합니다.</p><form id="leadForm"><div class="formgrid"><div class="field"><label>고객 유형</label><select id="leadType"><option>한국 수출 중소기업</option><option>인도네시아 수출기업</option><option>무역·유통업체</option><option>컨설팅·연구기관</option><option>개인 사업자</option></select></div><div class="field"><label>관심 산업</label><select id="leadSector">${['뷰티','식품','디지털','보건','산업','기타'].map(s=>`<option>${s}</option>`).join('')}</select></div></div><button class="btn primary" style="margin-top:14px" type="submit">시연 등록</button></form>`);$('#leadForm').onsubmit=e=>{e.preventDefault();leads.push({type:$('#leadType').value,sector:$('#leadSector').value,plan:p,date:new Date().toLocaleDateString('ko-KR')});save('leads',leads);closeModal();render();notify('시연 고객을 등록했습니다.')}}
function addLog(s){logs.unshift({time:new Date().toISOString(),text:s});logs=logs.slice(0,40);save('logs',logs)}
function operations(){return header('08 / DATA OPERATIONS','데이터·자동화 관리','데이터 가져오기, 유효성 검사, 수집 파이프라인 점검 및 백업을 관리합니다.')+notice()+`<div class="grid2 equal"><section class="panel"><div class="panel-head"><h2>데이터셋</h2><span class="pill gray">${data.mode==='demo'?'DEMO':'IMPORTED'}</span></div><div class="stack"><div class="split"><span>데이터 이름</span><b>${esc(data.dataset_name)}</b></div><div class="split"><span>레코드 수</span><b>${data.rows.length.toLocaleString()}</b></div><div class="split"><span>출처</span><span class="muted">${esc(data.source_url||'미지정 (가상)')}</span></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="$('#file').click()">JSON 가져오기</button><button class="btn" onclick="download('IB_sample_schema.json',JSON.stringify(SAMPLE,null,2),'application/json')">샘플 양식</button><button class="btn" onclick="download('IB_dataset.json',JSON.stringify(data,null,2),'application/json')">백업</button><button class="btn danger" onclick="resetData()">가상 데이터 복원</button></div><p class="footnote">JSON은 샘플 양식의 필드를 사용합니다. 중복, 필수 항목, 숫자 범위, 품목명 일관성을 검사합니다.</p></section><section class="panel"><div class="panel-head"><h2>자동화 실행 시뮬레이션</h2><button class="btn primary" onclick="runPipeline()">파이프라인 실행</button></div><div class="stack">${['데이터 구조 검증','중복 및 수치 검증','필터 및 점수 재계산','관심 목록 알림 초안 생성','실행 기록 저장'].map((s,i)=>`<div class="split"><span>${i+1}. ${s}</span><span class="muted">로컬</span></div>`).join('')}</div><p class="footnote">실제 외부 수집·결제·메일 발송·스케줄러는 미연동. 별도 Python 소스는 로컬 데이터 처리와 예약 실행의 출발점입니다.</p></section></div><section class="panel" style="margin-bottom:16px"><div class="panel-head"><h2>데이터 소스 레지스트리</h2></div><div class="tablewrap"><table><thead><tr><th>기관</th><th>수집 대상</th><th>연동 상태 / 제약</th><th>출처</th></tr></thead><tbody>${sources.map(s=>`<tr><td><b>${s[0]}</b></td><td>${s[1]}</td><td>${s[3]}</td><td><a href="${s[2]}" target="_blank" rel="noopener noreferrer">공식 사이트 ↗</a></td></tr>`).join('')}</tbody></table></div><p class="footnote">UN Comtrade <a href="https://comtrade.un.org/en/license-agreement" target="_blank" rel="noopener noreferrer">라이선스</a> 및 <a href="https://uncomtrade.org/docs/re-dissemination-of-data/" target="_blank" rel="noopener noreferrer">재배포 정책</a> 확인 필수. 무료 접근이 상업적 이용 허가를 뜻하지 않습니다.</p></section><section class="panel"><div class="panel-head"><h2>실행 로그</h2><button class="btn" onclick="download('IB_logs.json',JSON.stringify(logs,null,2),'application/json')">로그 저장</button></div><div class="log">${logs.map(l=>`<div>${esc(l.time)} · ${esc(l.text)}</div>`).join('')||'실행 이력이 없습니다.'}</div></section>`}
function validate(d){if(!d||typeof d.dataset_name!=='string'||!d.dataset_name.trim()||!Array.isArray(d.rows)||!d.rows.length||d.rows.length>100000)throw Error('데이터셋 이름 및 1~100,000개 rows 필요');let ids=new Set(),names=new Map();for(let r of d.rows){if(!r||!['KR_ID','ID_KR'].includes(r.direction)||typeof r.hs!=='string'||!/^\d{4}$/.test(r.hs)||typeof r.name!=='string'||!r.name.trim()||typeof r.sector!=='string'||!r.sector.trim()||!Number.isInteger(r.year)||r.year<1900||r.year>2100||!Number.isFinite(r.market_usd)||!Number.isFinite(r.bilateral_usd)||r.market_usd<0||r.bilateral_usd<0||r.bilateral_usd>r.market_usd)throw Error('잘못된 레코드: '+JSON.stringify(r).slice(0,130));let k=[r.direction,r.hs,r.year].join('|'),n=[r.direction,r.hs].join('|'),v=JSON.stringify([r.name,r.sector]);if(ids.has(k))throw Error('중복 레코드: '+k);if(names.has(n)&&names.get(n)!==v)throw Error('품목명 또는 산업 불일치: '+n);ids.add(k);names.set(n,v)}return true}
function resetData(){if(!confirm('가상 무역 데이터로 복원할까요? 관심 목록은 유지됩니다.'))return;data=SAMPLE;save('dataset',data);filters={direction:'KR_ID',sector:'all',query:'',period:'5'};queue=[];save('queue',queue);addLog('가상 데이터 복원');render()}
$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>25000000)throw Error('25MB 이하 JSON만 허용');let d=JSON.parse(await f.text());validate(d);data={dataset_name:d.dataset_name,source_url:typeof d.source_url==='string'?d.source_url:'',mode:'imported',rows:d.rows};save('dataset',data);filters={direction:data.rows[0].direction,sector:'all',query:'',period:'5'};queue=[];save('queue',queue);addLog('JSON 가져오기 성공: '+data.rows.length+'행');render();notify('데이터 가져오기 완료')}catch(err){addLog('가져오기 실패: '+err.message);render();notify('가져오기 실패: '+err.message)}finally{e.target.value=''}};
function runPipeline(){try{validate(data);addLog('데이터 검증 성공: '+data.rows.length+'행');selected();addLog('탐색 지표 재계산');buildAlerts();addLog('로컬 파이프라인 완료 (외부 수집·발송 없음)');render();notify('로컬 파이프라인 완료')}catch(e){addLog('파이프라인 실패: '+e.message);render();notify(e.message)}}
function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type:type+';charset=utf-8'}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const csvCell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,m=>"'"+m).replace(/"/g,'""')+'"';function exportCSV(){let h=['dataset_mode','direction','year','hs','name','sector','market_usd','bilateral_usd','growth_pct','share_pct','score'];let a=selected().map(r=>[data.mode,r.direction,r.year,r.hs,r.name,r.sector,r.market_usd,r.bilateral_usd,r.growth?.toFixed(2),r.share?.toFixed(2),r.score]);download('IB_trade.csv','\ufeff'+[h,...a].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv')}
function exportLeads(){download('IB_demo_leads.csv','\ufeff'+[['type','sector','plan','date'],...leads.map(l=>[l.type,l.sector,l.plan,l.date])].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv')}
function downloadAlerts(){download('IB_alerts.txt',queue.map(q=>`[${q.mode}] ${q.name} (${q.hs}) ${q.text}`).join('\n'),'text/plain')}
function openModal(html){$('#dialog').innerHTML=html;$('#modal').classList.add('open');$('#dialog').querySelector('button')?.focus()}function closeModal(){$('#modal').classList.remove('open')}$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function detail(hs){let r=selected().find(r=>r.hs===hs);if(!r)return;let rows=baseRows().filter(r=>r.hs===hs);openModal(`<div class="panel-head"><div><div class="eyebrow">HS ${esc(hs)} · ${esc(r.sector)}</div><h2>${esc(r.name)}</h2><p class="muted">${dirLabel()}</p></div><button class="btn" onclick="closeModal()">닫기</button></div>${notice()}<div class="kpis" style="grid-template-columns:repeat(2,1fr)">${kpi('수입시장',usd(r.market_usd),String(r.year))}${kpi('전년비',pct(r.growth),'시장 수입액')}${kpi('점유율',share(r.share),'상대국 비중')}${kpi('탐색 점수',r.score??'—','필터 집합 내')}</div>${lineChart(rows,years())}<p class="footnote">공식 규제·관세·가격·수요 추가 확인 필요.</p>`)}
const screens={overview,trade,opportunity,monitor,watch:watchPage,reports,revenue,operations};function render(){$('#nav').innerHTML=navs.map(([id,label,path])=>`<button class="${id===page?'active':''}" onclick="go('${id}')" ${id===page?'aria-current="page"':''}><svg viewBox="0 0 24 24"><path d="${path}"/></svg>${label}</button>`).join('');$('#crumb').textContent=navs.find(n=>n[0]===page)[1];$('#modeTag').textContent=data.mode==='demo'?'DEMO DATA':'IMPORTED DATA';$('#app').innerHTML='<div class="page">'+screens[page]()+'</div>';if(page==='revenue')revenueResult()}render();
</script></body></html>
